name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0)"
        required: true
        default: "v1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/fittrack-${{ inputs.version }}-debug.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FitTrack ${{ inputs.version }}
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            FitTrack debug build — install on Android 8.0+ (enable "install unknown apps").

            This is a debug-signed APK for testing. 100% free & offline.
          files: out/fittrack-${{ inputs.version }}-debug.apk
          fail_on_unmatched_files: true
